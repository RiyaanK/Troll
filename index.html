<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch Me If You Can!</title>
    <!-- Connecting Bootstrap for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Connecting your custom CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

    <!-- The container needs to be relative so the button stays inside it -->
    <div class="game-container text-center">
        <h2 class="mb-4">Click this button to win a prize!</h2>
        
        <button id="dodge-btn" class="btn btn-primary btn-lg shadow">
            Click Me!
        </button>
    </div>

    <!-- Connecting your custom JavaScript file at the very bottom -->
    <script src="script.js"></script>
</body>
</html>
